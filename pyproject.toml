[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mark"
version = "0.1.0"
description = "Python clone of mark — sync Markdown files to Confluence"
readme = "README.md"
requires-python = ">=3.10"
# Stdlib only (urllib, tomllib, argparse): no third-party runtime dependencies.
dependencies = []

[project.scripts]
mark = "mark.cli:main"

[tool.setuptools.packages.find]
include = ["mark*"]
